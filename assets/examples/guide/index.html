<title>设计评审操作指南（示例）</title>
<style>body{margin:0;background:#eef3f5;color:#21343c;font:16px/1.65 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:40px 24px}h1{font-size:32px;line-height:1.25}article{background:white;border:1px solid #d5e0e5;border-radius:14px;padding:24px;margin:24px 0;break-inside:avoid}h2{font-size:20px;margin:0 0 18px}.number{color:#167481}img{display:block;max-width:100%;height:auto;border-radius:8px;border:1px solid #e1e8eb}p{white-space:pre-wrap;overflow-wrap:anywhere}footer{color:#54717b;font-size:12px}@media print{body{background:white}main{padding:0}article{border:0;border-radius:0;padding:0;margin:24px 0}}</style></head><body><main>
<h1>设计评审操作指南（示例）</h1>
<article><h2><span class="number">步骤 1. 检查基准版本</span></h2>
<img src="images/0001-001-%E6%A3%80%E6%9F%A5%E5%9F%BA%E5%87%86%E7%89%88%E6%9C%AC.png" alt="步骤 1. 检查基准版本" loading="lazy">
<p>确认截图尺寸和基准内容，作为后续检查的参照。</p>
</article>
<article><h2><span class="number">步骤 2. 切换候选版本</span></h2>
<img src="images/0002-002-%E5%88%87%E6%8D%A2%E5%80%99%E9%80%89%E7%89%88%E6%9C%AC.png" alt="步骤 2. 切换候选版本" loading="lazy">
<p>逐一查看候选版本，保持同一区域和相同缩放。</p>
</article>
<article><h2><span class="number">步骤 3. 高亮可见改动</span></h2>
<img src="images/0003-003-%E9%AB%98%E4%BA%AE%E5%8F%AF%E8%A7%81%E6%94%B9%E5%8A%A8.png" alt="步骤 3. 高亮可见改动" loading="lazy">
<p>使用高亮改动查看变化，再检查细节。示例图片用于演示交付格式。</p>
</article>
<article><h2><span class="number">步骤 4. 交付评审结果</span></h2>
<img src="images/0004-004-%E4%BA%A4%E4%BB%98%E8%AF%84%E5%AE%A1%E7%BB%93%E6%9E%9C.png" alt="步骤 4. 交付评审结果" loading="lazy">
<p>将指南和文字一起交付；收件人解压后即可离线阅读。</p>
</article>
